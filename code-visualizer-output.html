<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visualizador Java - Main.java</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --accent-bg: rgba(88,166,255,0.15);
    --green: #3fb950;
    --green-bg: rgba(63,185,80,0.15);
    --red: #f85149;
    --orange: #d29922;
    --font: 'Consolas','Courier New',monospace;
    --line-h: 22px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font); font-size: 13px;
    height: 100vh; display: flex; flex-direction: column;
  }
  /* Toolbar */
  .toolbar {
    background: var(--surface); border-bottom:1px solid var(--border);
    padding: 10px 16px; display:flex; align-items:center; gap:12px;
    flex-wrap:wrap; flex-shrink:0;
  }
  .toolbar .badge { color: var(--accent); font-weight:600; font-size:12px; }
  .btn {
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:4px 12px; border-radius:6px; cursor:pointer; font-family:var(--font); font-size:13px;
    display:inline-flex; align-items:center; gap:4px;
  }
  .btn:hover { background:var(--accent-bg); border-color:var(--accent); }
  .btn:active { transform:scale(0.96); }
  .btn.primary { background:var(--accent); color:#0d1117; border-color:var(--accent); font-weight:600; }
  .btn.primary:hover { opacity:0.9; }
  .btn.danger { color:var(--red); }
  .btn.danger:hover { background:rgba(248,81,73,0.15); border-color:var(--red); }
  .speed-group { display:flex; align-items:center; gap:6px; color:var(--text-dim); font-size:12px; }
  .speed-group input[type=range] { width:80px; accent-color:var(--accent); }
  .step-counter { color:var(--text-dim); font-size:12px; margin-left:auto; }
  /* Main layout */
  .main { display:flex; flex:1; overflow:hidden; }
  .panel { overflow-y:auto; padding:12px 8px; }
  .panel-left { flex:1; min-width:300px; border-right:1px solid var(--border); }
  .panel-right { width:380px; min-width:280px; display:flex; flex-direction:column; }
  /* Code panel */
  .code-wrap { position:relative; }
  .line-nums { position:absolute; left:0; top:0; width:40px; text-align:right; padding-right:8px; color:var(--text-dim); user-select:none; line-height:var(--line-h); font-size:12px; }
  .code-lines { margin-left:40px; }
  .cl {
    line-height:var(--line-h); padding:0 8px; white-space:pre; min-height:22px;
    border-left:3px solid transparent; transition:background 0.15s,border-color 0.15s;
  }
  .cl.cur {
    background:rgba(88,166,255,0.22);
    border-left:3px solid #58a6ff;
  }
  .cl.dim { color:var(--text-dim); }
  .cl.keyword { color:#ff7b72; }
  .cl.type { color:#ffa657; }
  .cl.str { color:#a5d6ff; }
  .cl.num { color:#79c0ff; }
  .cl.comment { color:#8b949e; font-style:italic; }
  /* Variables panel */
  .panel-right h3 {
    font-size:12px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--text-dim); margin-bottom:8px; padding:0 8px;
  }
  #vars-table {
    width:100%; border-collapse:collapse; font-size:13px;
  }
  #vars-table th {
    text-align:left; padding:4px 8px; color:var(--text-dim);
    font-weight:500; font-size:11px; text-transform:uppercase;
    border-bottom:1px solid var(--border); position:sticky; top:0;
    background:var(--surface);
  }
  #vars-table td {
    padding:3px 8px; border-bottom:1px solid var(--border);
    font-family:var(--font); vertical-align:top;
  }
  #vars-table tr.changed td { background:var(--green-bg); }
  #vars-table .var-name { color:var(--accent); }
  #vars-table .var-val { color:var(--text); }
  #vars-table .var-type { color:var(--text-dim); font-size:11px; }
  #vars-table .no-vars { color:var(--text-dim); font-style:italic; padding:12px 8px; }
  /* Output panel */
  .output-wrap { border-top:1px solid var(--border); margin-top:auto; }
  .output-wrap h3 {
    font-size:12px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--text-dim); padding:8px 8px 4px; margin:0;
  }
  #output-list {
    list-style:none; padding:4px 8px 8px; max-height:160px; overflow-y:auto;
  }
  #output-list li {
    padding:2px 0; font-size:13px; color:var(--green);
  }
  #output-list li.error { color:var(--red); }
  /* Call stack */
  .stack-wrap { border-top:1px solid var(--border); }
  .stack-wrap h3 {
    font-size:12px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--text-dim); padding:8px 8px 4px; margin:0;
  }
  #stack-info { padding:4px 8px 8px; font-size:12px; color:var(--text-dim); }
  /* Status bar */
  .status-bar {
    background:var(--surface); border-top:1px solid var(--border);
    padding:4px 16px; font-size:11px; color:var(--text-dim);
    display:flex; justify-content:space-between; flex-shrink:0;
  }
  .status-bar .error { color:var(--red); }
  /* Scrollbar */
  ::-webkit-scrollbar { width:8px; }
  ::-webkit-scrollbar-track { background:var(--bg); }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
  ::-webkit-scrollbar-thumb:hover { background:#484f58; }
</style>
</head>
<body>

<div class="toolbar">
  <span class="badge">☕ Java</span>
  <button class="btn primary" id="playBtn">▶ Play</button>
  <button class="btn" id="pauseBtn" disabled>⏸ Pausa</button>
  <button class="btn danger" id="stopBtn">⏹ Stop</button>
  <button class="btn" id="stepBtn">⏭ Step</button>
  <div class="speed-group">
    <span>Vel:</span>
    <input type="range" id="speedSlider" min="50" max="2000" value="500">
    <span id="speedLabel">500ms</span>
  </div>
  <span class="step-counter" id="stepCounter">Paso 0 / 0</span>
</div>

<div class="main">
  <div class="panel panel-left">
    <div class="code-wrap">
      <div class="line-nums" id="lineNums"></div>
      <div class="code-lines" id="codeLines"></div>
    </div>
  </div>
  <div class="panel panel-right">
    <div style="flex:1;overflow-y:auto;">
      <h3>Variables</h3>
      <table id="vars-table">
        <thead><tr><th>Variable</th><th>Valor</th><th>Tipo</th></tr></thead>
        <tbody id="varsBody"></tbody>
      </table>
    </div>
    <div class="output-wrap">
      <h3>Resultados</h3>
      <ul id="output-list"></ul>
    </div>
    <div class="stack-wrap">
      <h3>Call Stack</h3>
      <div id="stack-info">main: —</div>
    </div>
  </div>
</div>

<div class="status-bar">
  <span id="statusText">Listo — Presiona Play o Step</span>
  <span id="statusSteps"></span>
</div>

<script>
// ─── Código fuente ───
const CODE_LINES = [
  "public class Main {",
  "",
  "    public static void main(String[] args) {",
  "",
  "        int a = 1, b = 2;",
  "        if (++a == b)",
  "            a++;",
  "        for (int i = 0; i < a; i += 2) {",
  "            a += i;",
  "            i++;",
  "        }",
  "",
  "        System.out.println(\"Valor final de a: \" + a);",
  "        System.out.println(\"Valor final de b: \" + b);",
  "        System.out.println(\"Valor final de i: \" + i);",
  "    }",
  "}"
];

// ─── Build Steps (simulador Java) ───
function buildSteps(lines) {
  const steps = [];
  const varDecls = []; // {name, type}
  let braceDepth = 0;
  let skipUntil = -1;
  let forHeader = null; // {initLineno, condExpr, incrExpr, bodyStart, bodyEnd}
  let ifCondActive = false; // estamos dentro del cuerpo de un if

  for (let i = 0; i < lines.length; i++) {
    if (skipUntil > i) continue;
    skipUntil = -1;

    const raw = lines[i];
    const trimmed = raw.trim();
    const lineNo = i + 1;

    // Vacía o solo llaves
    if (trimmed === '' || trimmed === '{' || trimmed === '}') {
      if (trimmed === '{') braceDepth++;
      if (trimmed === '}') braceDepth--;
      steps.push({ line: lineNo, text: raw, type: 'noop', desc: '' });
      continue;
    }

    // Comentarios
    if (trimmed.startsWith('//') || trimmed.startsWith('/*') || trimmed.startsWith('*')) {
      steps.push({ line: lineNo, text: raw, type: 'comment', desc: '' });
      continue;
    }

    // Clase / método
    if (/^public\s+(class|static)\b/.test(trimmed)) {
      steps.push({ line: lineNo, text: raw, type: 'decl', desc: trimmed.replace('{','').trim() });
      continue;
    }

    // System.out.println
    const printlnMatch = trimmed.match(/System\.out\.println\s*\((.+)\)\s*;/);
    if (printlnMatch) {
      steps.push({ line: lineNo, text: raw, type: 'println', desc: '', expr: printlnMatch[1] });
      continue;
    }

    // for header: for (...)
    const forMatch = trimmed.match(/^for\s*\(([^;]+);([^;]+);([^)]+)\)\s*\{?$/);
    if (forMatch) {
      steps.push({ line: lineNo, text: raw, type: 'for-header', desc: '',
        initRaw: forMatch[1].trim(), condRaw: forMatch[2].trim(), incrRaw: forMatch[3].trim() });
      continue;
    }

    // if
    const ifMatch = trimmed.match(/^if\s*\((.+)\)\s*\{?$/);
    if (ifMatch) {
      steps.push({ line: lineNo, text: raw, type: 'if', desc: '', cond: ifMatch[1].trim() });
      continue;
    }

    // Declaración con asignación (int a = 1, b = 2;)
    const declAssignMatch = trimmed.match(/^(int|double|float|boolean|char|String|long)\s+(.+);$/);
    if (declAssignMatch) {
      const type = declAssignMatch[1];
      const rest = declAssignMatch[2];
      // Pueden ser múltiples: a=1, b=2
      const parts = rest.split(',').map(s => s.trim());
      const vars = parts.map(p => {
        const eq = p.indexOf('=');
        if (eq >= 0) return { name: p.slice(0, eq).trim(), init: p.slice(eq+1).trim() };
        return { name: p, init: null };
      });
      steps.push({ line: lineNo, text: raw, type: 'decl-assign', desc: '', vars, varType: type });
      continue;
    }

    // Asignación simple: a++;
    const incMatch = trimmed.match(/^([a-zA-Z_]\w*)\+\+;$/);
    if (incMatch) {
      steps.push({ line: lineNo, text: raw, type: 'postinc', desc: '', varName: incMatch[1] });
      continue;
    }

    // Asignación con op: a += i;
    const assignOpMatch = trimmed.match(/^([a-zA-Z_]\w*)\s*(\+=|-=|\*=|/=|%=)\s*(.+);$/);
    if (assignOpMatch) {
      steps.push({ line: lineNo, text: raw, type: 'assign-op', desc: '',
        varName: assignOpMatch[1], op: assignOpMatch[2], expr: assignOpMatch[3].trim() });
      continue;
    }

    // Asignación simple: a = expr;
    const assignMatch = trimmed.match(/^([a-zA-Z_]\w*)\s*=\s*(.+);$/);
    if (assignMatch) {
      steps.push({ line: lineNo, text: raw, type: 'assign', desc: '',
        varName: assignMatch[1], expr: assignMatch[2].trim() });
      continue;
    }

    // default
    steps.push({ line: lineNo, text: raw, type: 'unknown', desc: trimmed });
  }

  return steps;
}

const steps = buildSteps(CODE_LINES);

// ─── Simulador ───
const sim = {
  idx: -1,
  scope: {},
  output: [],
  loops: [], // stack de loops: {iter, items, condAt, incrAt, bodyEndAt}
  callStack: [{ method: 'main', line: 0 }],
  stepCount: 0,
  finished: false,
  error: null,
  changedVars: [],

  reset() {
    this.idx = -1;
    this.scope = {};
    this.output = [];
    this.loops = [];
    this.callStack = [{ method: 'main', line: 0 }];
    this.stepCount = 0;
    this.finished = false;
    this.error = null;
    this.changedVars = [];
  },

  canAdvance() {
    if (this.finished || this.error) return false;
    return this.idx + 1 < steps.length;
  },

  eval(expr) {
    if (expr == null) return undefined;
    const s = expr.trim();
    // Variables
    if (/^[a-zA-Z_]\w*$/.test(s)) {
      if (s in this.scope) return this.scope[s];
      return undefined;
    }
    // Literales numéricos
    if (/^-?\d+(\.\d+)?$/.test(s)) return Number(s);
    // Strings literales
    const strMatch = s.match(/^"([^"]*)"$/);
    if (strMatch) return strMatch[1];
    // Suma de string (concatenación)
    if (/"/.test(s) && s.includes('+')) {
      return this.evalConcat(s);
    }
    // Operaciones aritméticas básicas
    try {
      // Intentar evaluar con precaución (solo + - * / con vars y nums)
      let jsExpr = s;
      for (const k in this.scope) {
        const val = this.scope[k];
        if (typeof val === 'number' || typeof val === 'string') {
          jsExpr = jsExpr.replace(new RegExp('\\b' + k + '\\b', 'g'), 
            typeof val === 'string' ? `"${val}"` : String(val));
        }
      }
      // eslint-disable-next-line no-eval
      return Function('"use strict"; return (' + jsExpr + ')')();
    } catch (e) {
      return undefined;
    }
  },

  evalConcat(s) {
    // Partir por + respetando strings
    let result = '';
    let current = '';
    let inStr = false;
    let strChar = null;
    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      if (inStr) {
        if (ch === strChar) { inStr = false; result += current; current = ''; }
        else { current += ch; }
      } else {
        if (ch === '"') { inStr = true; strChar = '"'; current = ''; }
        else if (ch === '+') {
          const trimmed = current.trim();
          if (trimmed) result += this.eval(trimmed);
          current = '';
        } else { current += ch; }
      }
    }
    const trimmed = current.trim();
    if (trimmed) result += this.eval(trimmed);
    return result;
  },

  advance() {
    if (!this.canAdvance()) { this.finished = true; return false; }
    this.idx++;
    this.stepCount++;
    this.changedVars = [];
    const step = steps[this.idx];
    const line = step.line;

    // Actualizar call stack
    if (this.callStack.length > 0) {
      this.callStack[this.callStack.length - 1].line = line;
    }

    switch (step.type) {
      case 'noop':
      case 'comment':
      case 'decl':
        break;

      case 'decl-assign': {
        for (const v of step.vars) {
          const val = v.init != null ? this.eval(v.init) : 0;
          this.scope[v.name] = val;
          this.changedVars.push(v.name);
        }
        break;
      }

      case 'postinc': {
        const name = step.varName;
        if (name in this.scope) {
          this.scope[name]++;
          this.changedVars.push(name);
        }
        break;
      }

      case 'assign-op': {
        const name = step.varName;
        const rhs = this.eval(step.expr);
        if (name in this.scope && rhs !== undefined) {
          switch (step.op) {
            case '+=': this.scope[name] += rhs; break;
            case '-=': this.scope[name] -= rhs; break;
            case '*=': this.scope[name] *= rhs; break;
            case '/=': this.scope[name] /= rhs; break;
            case '%=': this.scope[name] %= rhs; break;
          }
          this.changedVars.push(name);
        }
        break;
      }

      case 'assign': {
        const val = this.eval(step.expr);
        if (val !== undefined) {
          this.scope[step.varName] = val;
          this.changedVars.push(step.varName);
        }
        break;
      }

      case 'if': {
        const cond = this.eval(step.cond);
        // Si la condición es falsa, buscar el else o la línea después
        if (!cond) {
          // Saltar el cuerpo del if (siguiente línea indentada)
          // Buscar próxima línea con igual o menor indentación que no sea '}' o vacía
          const curIndent = step.text.search(/\S/);
          let skip = this.idx + 1;
          while (skip < steps.length) {
            const sLine = steps[skip];
            const sIndent = sLine.text.search(/\S/);
            if (sIndent <= curIndent && sLine.type !== 'noop' && sLine.type !== 'comment') break;
            skip++;
          }
          this.idx = skip - 1; // -1 porque el loop hará idx++
        }
        break;
      }

      case 'for-header': {
        // Inicializar variable del for
        const initMatch = step.initRaw.match(/^(int|double|float|long)\s+([a-zA-Z_]\w*)\s*=\s*(.+)$/);
        if (initMatch) {
          const name = initMatch[2];
          const initVal = this.eval(initMatch[3]);
          this.scope[name] = initVal !== undefined ? initVal : 0;
          this.changedVars.push(name);
        }
        // Evaluar condición
        const condVal = this.eval(step.condRaw);
        if (!condVal) {
          // No entra, saltar hasta el final del bloque
          const startDepth = braceDepthAt(step.line);
          let skip = this.idx + 1;
          let d = startDepth;
          while (skip < steps.length) {
            const txt = steps[skip].text.trim();
            if (txt === '{') d++;
            else if (txt === '}') { d--; if (d === startDepth) break; }
            skip++;
          }
          this.idx = skip;
        }
        // Guardar info del for para el incremento y el loop
        const forInfo = {
          varName: initMatch ? initMatch[2] : null,
          condRaw: step.condRaw,
          incrRaw: step.incrRaw,
          headerIdx: this.idx,
          bodyStartIdx: this.idx + 1,
          iterCount: 0,
          exit: false
        };
        this.loops.push(forInfo);
        break;
      }

      case 'println': {
        const val = this.eval(step.expr);
        this.output.push(String(val != null ? val : 'null'));
        break;
      }

      default:
        break;
    }

    // Después de ejecutar el paso, si hay loops activos, manejar incremento y condición
    this.processLoops();

    return true;
  },

  processLoops() {
    // Buscar si el paso actual está dentro del cuerpo de un for y si termina el cuerpo
    // (se maneja desde el avance detectando que el siguiente paso cierra el bloque)
    const currentStep = steps[this.idx];
    if (!currentStep) return;

    // Detectar cierre de cuerpo de for: cuando la línea actual es '}' y hay un loop activo
    const trimmed = currentStep.text.trim();
    if (trimmed === '}' && this.loops.length > 0) {
      const loop = this.loops[this.loops.length - 1];
      if (!loop.exit) {
        loop.iterCount++;
        // Incrementar
        const incrExpr = loop.incrRaw;
        // i++ o ++i o i += 2, etc.
        const incrMatch = incrExpr.match(/^([a-zA-Z_]\w*)\s*(\+\+|--)$/);
        if (incrMatch) {
          const name = incrMatch[1];
          if (name in this.scope) {
            this.scope[name]++;
            this.changedVars.push(name);
          }
        }
        const incrAssign = incrExpr.match(/^([a-zA-Z_]\w*)\s*(\+=|-=)\s*(.+)$/);
        if (incrAssign) {
          const name = incrAssign[1];
          const val = this.eval(incrAssign[3]);
          if (name in this.scope && val !== undefined) {
            if (incrAssign[2] === '+=') this.scope[name] += val;
            else this.scope[name] -= val;
            this.changedVars.push(name);
          }
        }
        // Evaluar condición
        const condVal = this.eval(loop.condRaw);
        if (!condVal) {
          loop.exit = true;
        } else {
          // Volver al inicio del cuerpo
          this.idx = loop.bodyStartIdx - 1; // -1 porque advance hará idx++
        }
      }
    }
  },

  getCurrentStep() {
    if (this.idx < 0 || this.idx >= steps.length) return null;
    return steps[this.idx];
  }
};

function braceDepthAt(lineNo) {
  let d = 0;
  for (let i = 0; i < lineNo && i < CODE_LINES.length; i++) {
    const t = CODE_LINES[i].trim();
    if (t === '{' || t.endsWith('{')) d++;
    if (t === '}') d--;
  }
  return d;
}

// ─── UI ───
function renderCode() {
  const numsEl = document.getElementById('lineNums');
  const linesEl = document.getElementById('codeLines');
  numsEl.innerHTML = CODE_LINES.map((_, i) => `<div style="line-height:var(--line-h)">${i+1}</div>`).join('');
  linesEl.innerHTML = CODE_LINES.map((l, i) => {
    let cls = 'cl';
    const t = l.trim();
    if (t.startsWith('//') || t.startsWith('/*') || t.startsWith('*')) cls += ' comment';
    else if (/^public\s/.test(t) || /^import\s/.test(t)) cls += ' keyword';
    else if (/^(int|double|float|boolean|char|String|long|void)\b/.test(t)) cls += ' type';
    const html = l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<div class="${cls}" data-line="${i+1}">${html}</div>`;
  }).join('');
}

function render() {
  // Highlight línea actual
  document.querySelectorAll('.cl').forEach(el => el.classList.remove('cur'));
  const curStep = sim.getCurrentStep();
  if (curStep) {
    const el = document.querySelector(`.cl[data-line="${curStep.line}"]`);
    if (el) el.classList.add('cur');
  }

  // Variables
  const tbody = document.getElementById('varsBody');
  const keys = Object.keys(sim.scope);
  if (keys.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" class="no-vars">(ninguna variable aún)</td></tr>';
  } else {
    tbody.innerHTML = keys.map(k => {
      const v = sim.scope[k];
      const valStr = typeof v === 'string' ? `"${v}"` : String(v);
      const typeStr = typeof v === 'number' ? (Number.isInteger(v) ? 'int' : 'double') : typeof v === 'string' ? 'String' : typeof v;
      const changed = sim.changedVars.includes(k) ? ' class="changed"' : '';
      return `<tr${changed}><td class="var-name">${k}</td><td class="var-val">${valStr}</td><td class="var-type">${typeStr}</td></tr>`;
    }).join('');
  }

  // Output
  const outList = document.getElementById('output-list');
  outList.innerHTML = sim.output.map(o => `<li>${o.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</li>`).join('');

  // Stack
  document.getElementById('stack-info').textContent = 
    sim.callStack.map(f => `${f.method}:${f.line}`).join(' → ') || '(—)';

  // Step counter
  const total = steps.length;
  const current = sim.idx + 1;
  document.getElementById('stepCounter').textContent = `Paso ${current} / ${total}`;

  // Status
  if (sim.error) {
    document.getElementById('statusText').innerHTML = `<span class="error">Error: ${sim.error}</span>`;
  } else if (sim.finished) {
    document.getElementById('statusText').textContent = '✅ Ejecución completada';
  } else if (sim.idx >= 0) {
    const s = steps[sim.idx];
    document.getElementById('statusText').textContent = `Ejecutando línea ${s.line}: ${s.text.trim()}`;
  } else {
    document.getElementById('statusText').textContent = 'Listo — Presiona Play o Step';
  }
  document.getElementById('statusSteps').textContent = `Steps: ${sim.stepCount}`;
}

// ─── Controles ───
let timer = null;
let isPlaying = false;

function doStep() {
  if (sim.error || sim.finished) return;
  if (!sim.canAdvance()) {
    sim.finished = true;
    if (isPlaying) stopPlay();
    render();
    return;
  }
  sim.advance();
  render();
  if (!sim.canAdvance()) {
    sim.finished = true;
    if (isPlaying) stopPlay();
    render();
  }
}

function startPlay() {
  if (sim.finished) { doStop(); }
  if (isPlaying) return;
  if (!sim.canAdvance()) { doStop(); return; }
  isPlaying = true;
  document.getElementById('playBtn').disabled = true;
  document.getElementById('pauseBtn').disabled = false;
  const speed = parseInt(document.getElementById('speedSlider').value);
  document.getElementById('statusText').textContent = '▶ Ejecutando...';
  function tick() {
    if (!isPlaying) return;
    if (!sim.canAdvance() || sim.error) {
      stopPlay();
      sim.finished = true;
      render();
      return;
    }
    doStep();
    if (sim.canAdvance() && !sim.error) {
      const spd = parseInt(document.getElementById('speedSlider').value);
      timer = setTimeout(tick, spd);
    } else {
      stopPlay();
      render();
    }
  }
  tick();
}

function stopPlay() {
  isPlaying = false;
  if (timer) { clearTimeout(timer); timer = null; }
  document.getElementById('playBtn').disabled = false;
  document.getElementById('pauseBtn').disabled = true;
}

function doPause() {
  stopPlay();
  document.getElementById('statusText').textContent = '⏸ Pausado';
}

function doStop() {
  stopPlay();
  sim.reset();
  render();
  document.getElementById('statusText').textContent = '⏹ Reiniciado';
}

// Eventos
document.getElementById('playBtn').addEventListener('click', startPlay);
document.getElementById('pauseBtn').addEventListener('click', doPause);
document.getElementById('stopBtn').addEventListener('click', doStop);
document.getElementById('stepBtn').addEventListener('click', doStep);

document.getElementById('speedSlider').addEventListener('input', function() {
  document.getElementById('speedLabel').textContent = this.value + 'ms';
  if (isPlaying) {
    stopPlay();
    startPlay();
  }
});

// Teclado
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  switch(e.key) {
    case ' ': e.preventDefault(); doStep(); break;
    case 'p': case 'P': startPlay(); break;
    case 's': case 'S': doStop(); break;
  }
});

// Init
renderCode();
render();
</script>
