<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visualizador Java — Paso a Paso</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3;
    --muted:#8b949e; --accent:#58a6ff; --green:#3fb950; --red:#f85149;
    --line-cur: rgba(88,166,255,.22);
  }
  *{box-sizing:border-box; font-family:Consolas,'Courier New',monospace;}
  body{margin:0; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column;}
  header{padding:10px 16px; border-bottom:1px solid var(--border); display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:var(--panel);}
  header .badge{background:#1f6feb33; color:var(--accent); padding:3px 10px; border-radius:12px; font-size:12px; border:1px solid #1f6feb55;}
  .btn{background:#21262d; color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 12px; cursor:pointer; font-size:13px;}
  .btn:hover{background:#30363d;}
  .btn.primary{background:#238636; border-color:#2ea043;}
  .btn.primary:hover{background:#2ea043;}
  .btn.danger{background:#da3633; border-color:#f85149;}
  .btn.danger:hover{background:#f85149;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  header label{font-size:12px; color:var(--muted);}
  input[type=range]{width:110px; accent-color:var(--accent);}
  #status{font-size:12px; color:var(--muted); margin-left:auto;}
  main{flex:1; display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--border); overflow:hidden;}
  @media(max-width:800px){ main{grid-template-columns:1fr;} }
  section{background:var(--bg); overflow:auto; padding:12px;}
  section h2{font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:0 0 10px 0;}
  #code{font-size:13px; line-height:1.7;}
  #code .ln{display:flex; gap:12px; padding:0 8px; border-left:3px solid transparent; white-space:pre;}
  #code .num{color:#484f58; text-align:right; width:28px; flex-shrink:0; user-select:none;}
  #code .cur{background:var(--line-cur); border-left:3px solid var(--accent);}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{padding:6px 8px; text-align:left; border-bottom:1px solid var(--border);}
  th{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px;}
  tr.changed td{background:rgba(63,185,80,.15);}
  td .type-tag{color:var(--muted); font-size:11px; margin-left:6px;}
  .empty{color:var(--muted); font-size:13px; font-style:italic; padding:8px;}
  .callstack{margin:6px 0; font-size:12px; color:var(--muted);}
  .callstack b{color:var(--accent);}
  #output{list-style:none; margin:0; padding:0; font-size:13px;}
  #output li{padding:4px 8px; border-bottom:1px dashed var(--border);}
  #output li::before{content:'> '; color:var(--accent);}
  .error{color:var(--red); font-weight:bold; padding:8px;}
  .separator{border-top:1px solid var(--border); margin:16px 0 8px;}
  .desc{font-size:12px; color:var(--green); padding:8px; background:#1c2128; border-radius:6px; margin-bottom:10px; border-left:3px solid var(--green);}
</style>
</head>
<body>
<header>
  <span class="badge">Java · intérprete simulado</span>
  <button class="btn primary" id="play">▶ Play</button>
  <button class="btn" id="pause">⏸ Pausa</button>
  <button class="btn danger" id="stop">⏹ Reiniciar</button>
  <button class="btn" id="step">⏭ Paso</button>
  <label>Velocidad <input type="range" id="speed" min="50" max="2000" value="500"></label>
  <span id="speedVal">500ms</span>
  <span id="status">Paso 0 / 0</span>
</header>

<main>
  <section id="codePanel">
    <h2>Código fuente</h2>
    <div id="code"></div>
  </section>
  <section id="rightPanel">
    <h2>Descripción del paso</h2>
    <div class="desc" id="stepDesc">—</div>
    <div class="callstack" id="callstack">Call stack: —</div>
    <h2>Variables</h2>
    <table id="varsTable">
      <thead><tr><th>Variable</th><th>Valor</th><th>Tipo</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="separator"></div>
    <h2>Resultados</h2>
    <ul id="output"></ul>
  </section>
</main>

<script type="text/plain" id="src">import java.util.Arrays;
import java.util.Scanner;

public class trabajo2 {

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        int[] numbers = new int[8];
        System.out.println("Por favor introduce 8 numeros:");

        for (int i = 0; i < numbers.length; i++) {
            numbers[i] = sc.nextInt();
        }

        int pares = contarPares(numbers);
        int max = mayor(numbers);
        int min = menor(numbers);
        int[] invert = invertir(numbers);

        System.out.println("Numeros: " + Arrays.toString(numbers));
        System.out.println("Pares: " + pares);
        System.out.println("Mayor: " + max);
        System.out.println("Menor: " + min);
        System.out.println("Invertido: " + Arrays.toString(invert));
    }

    static int contarPares(int[] n) {
        int contador = 0;
        for (int v : n) {
            if (v % 2 == 0) {
                contador++;
            }
        }
        return contador;
    }

    static int mayor(int[] numeros) {
        int mayor = numeros[0];
        for (int v : numeros) {
            if (v > mayor) {
                mayor = v;
            }
        }
        return mayor;
    }

    static int menor(int[] numeros) {
        int menor = numeros[0];
        for (int v : numeros) {
            if (v < menor) {
                menor = v;
            }
        }
        return menor;
    }

    static int[] invertir(int[] numeros) {
        int[] invertido = new int[numeros.length];
        for (int i = 0; i < numeros.length; i++) {
            invertido[i] = numeros[numeros.length - 1 - i];
        }
        return invertido;
    }
}</script>

<script>
(function(){
  "use strict";
  var SRC = document.getElementById('src').textContent;
  var lines = SRC.split('\n');
  var INPUT = [4,7,2,9,10,3,6,5]; // entrada simulada del Scanner

  // ---------- brace matching ----------
  function buildLineData(src){
    var lineStart=[0], i;
    for(i=0;i<src.length;i++) if(src[i]==='\n') lineStart.push(i+1);
    var stack=[], openToClose={}, closeToOpen={};
    for(i=0;i<src.length;i++){
      var c=src[i];
      if(c==='{') stack.push(i);
      else if(c==='}'){ var o=stack.pop(); openToClose[o]=i; closeToOpen[i]=o; }
    }
    function charToLine(pos){ var lo=0,hi=lineStart.length-1; while(lo<hi){var m=(lo+hi+1)>>1; if(lineStart[m]<=pos) lo=m; else hi=m-1;} return lo; }
    var matchClose={}, matchOpen={};
    for(var o in openToClose){ matchClose[charToLine(+o)]=charToLine(openToClose[o]); }
    for(var c in closeToOpen){ matchOpen[charToLine(+c)]=charToLine(closeToOpen[c]); }
    return {matchClose:matchClose, matchOpen:matchOpen, lineStart:lineStart};
  }
  var BM = buildLineData(SRC);

  // ---------- evaluation helpers ----------
  function splitArgs(s){ var out=[],d=0,cur=''; for(var i=0;i<s.length;i++){var ch=s[i]; if(ch==='(')d++; else if(ch===')')d--; if(ch===','&&d===0){out.push(cur.trim());cur='';} else cur+=ch;} if(cur.trim())out.push(cur.trim()); return out; }
  function findClose(s,open){ var d=0; for(var i=open;i<s.length;i++){ if(s[i]==='(')d++; else if(s[i]===')'){d--; if(d===0)return i;} } return -1; }
  function arrToStr(a){ return '[' + a.map(function(x){return x===undefined?'_':x;}).join(', ') + ']'; }
  function evalSimple(expr, vars){
    try{ return new Function('v','with(v){ return ('+expr+'); }')(vars); }
    catch(e){ return expr; }
  }
  function resolveExpr(expr, vars){
    var s = expr;
    while(s.indexOf('Arrays.toString')>=0){
      var i = s.indexOf('Arrays.toString');
      var open = s.indexOf('(', i);
      var close = findClose(s, open);
      var inner = s.slice(open+1, close).trim();
      var val = evalSimple(inner, vars);
      var rep = '[' + (Array.isArray(val)? val.map(function(x){return x===undefined?'_':x;}).join(', ') : String(val)) + ']';
      s = s.slice(0,i) + JSON.stringify(rep) + s.slice(close+1);
    }
    while(s.indexOf('Arrays.asList')>=0){
      var j=s.indexOf('Arrays.asList'); var o=s.indexOf('(',j); var cl=findClose(s,o);
      var inn=s.slice(o+1,cl); var vals=splitArgs(inn).map(function(e){return evalSimple(e,vars);});
      var r='['+vals.join(', ')+']';
      s=s.slice(0,j)+JSON.stringify(r)+s.slice(cl+1);
    }
    return evalSimple(s, vars);
  }

  // ---------- interpreter ----------
  function simulate(){
    var trace=[], output=[], inputIdx=0, steps=0;
    var methods={};
    for(var li=0; li<lines.length; li++){
      var t=lines[li].trim();
      var sig=/^(?:public\s+|private\s+|protected\s+|static\s+)*(?:int\[\]|int|double|boolean|String\[\]|String|void|float|char)\s+(\w+)\s*\(([^)]*)\)\s*\{\s*$/.exec(t);
      if(sig){
        var params=[];
        sig[2].split(',').forEach(function(p){
          p=p.trim(); if(!p) return;
          var pm=p.match(/(?:int\[\]|String\[\]|int|String|double|boolean|float|char)\s+(\w+)/);
          params.push(pm?pm[1]:(p.split(/\s+/).pop()));
        });
        methods[sig[1]]={params:params, bodyStart:li+1, bodyEnd:BM.matchClose[li]};
      }
    }
    function snapVars(f){ var out={}; for(var k in f.vars){ var v=f.vars[k]; out[k]=Array.isArray(v)?v.slice():v; } return out; }
    function recordStep(lineIdx, changed, desc, disp){
      trace.push({line:lineIdx, desc:desc, changed:changed.slice(), method:disp.method,
        vars:snapVars(disp), output:output.slice(), stack:frames.map(function(f){return f.method;}).join(' -> ')});
    }
    function topFrame(){ return frames[frames.length-1]; }
    function topBlock(){ var f=topFrame(); return f.blocks.length? f.blocks[f.blocks.length-1]:null; }

    var main = methods['main'];
    var frames=[{method:'main', vars:{}, pc:main.bodyStart, blocks:[], pendingAssign:null}];

    function executeNext(){
      var f = topFrame();
      var lineIdx = f.pc;
      var line = lines[lineIdx] || '';
      f.pc++;
      var t = line.trim();
      var changed=[];
      var desc = t || '(línea vacía)';

      // closing brace -> loop continuation / pop block
      if(t === '}'){
        var blk = topBlock();
        if(blk){
          if(blk.type==='for'){
            var nv = blk.op==='++' ? f.vars[blk.updVar]+1 : f.vars[blk.updVar]-1;
            f.vars[blk.updVar]=nv; changed.push(blk.updVar);
            if(resolveExpr(blk.cond, f.vars)){ f.pc=blk.bodyStart; desc='Continuando bucle for → '+(blk.updVar+'='+nv); }
            else { f.blocks.pop(); desc='Fin del bucle for'; }
          } else if(blk.type==='foreach'){
            blk.idx++;
            if(blk.idx < blk.arr.length){
              f.vars[blk.item]=blk.arr[blk.idx];
              f.pc=blk.bodyStart; changed.push(blk.item);
              desc='Siguiente iteración: '+blk.item+'='+blk.arr[blk.idx];
            } else { f.blocks.pop(); desc='Fin del bucle for-each'; }
          } else {
            f.blocks.pop();
          }
        }
        recordStep(lineIdx, changed, desc, f);
        return;
      }

      // return
      if(t.indexOf('return ')===0){
        var rexpr = t.slice(7).replace(/;$/,'').trim();
        var rv = resolveExpr(rexpr, f.vars);
        var pending = f.pendingAssign;
        var retLine = lineIdx;
        frames.pop();
        var caller = frames.length? frames[frames.length-1]:null;
        if(caller && pending){ caller.vars[pending.var]=rv; changed.push(pending.var); }
        recordStep(retLine, changed, 'return '+rexpr+' → '+fmtVal(rv), caller||f);
        return;
      }

      // for (int i=..; ..; i++)
      var forl=/^for\s*\(\s*(?:int|var|double|String|float)\s+(\w+)\s*=\s*(.+?);\s*(.+?);\s*(\w+)(\+\+|\-\-)\s*\)\s*\{\s*$/.exec(t);
      if(forl){
        f.vars[forl[1]]=resolveExpr(forl[2], f.vars);
        var condVal=resolveExpr(forl[3], f.vars);
        f.blocks.push({type:'for', updVar:forl[4], op:forl[5], cond:forl[3], bodyStart:lineIdx+1});
        changed.push(forl[1]);
        if(!condVal){ f.pc=BM.matchClose[lineIdx]+1; f.blocks.pop(); desc='Condición falsa → se salta el bucle'; }
        else desc='for: inicia '+forl[1]+'='+f.vars[forl[1]];
        recordStep(lineIdx, changed, desc, f);
        return;
      }

      // for-each
      var foe=/^for\s*\(\s*(?:int\[\]|int|String\[\]|String|double|boolean|float|char|var)\s+(\w+)\s*:\s*(.+?)\s*\)\s*\{\s*$/.exec(t);
      if(foe){
        var arr=resolveExpr(foe[2], f.vars);
        var item=foe[1];
        if(Array.isArray(arr) && arr.length){
          f.vars[item]=arr[0];
          changed.push(item);
          f.blocks.push({type:'foreach', item:item, arr:arr, idx:0, bodyStart:lineIdx+1});
          desc='for-each: '+item+'='+arr[0];
        } else { f.blocks.push({type:'foreach', item:item, arr:arr||[], idx:-1, bodyStart:lineIdx+1}); desc='for-each sobre array vacío'; }
        recordStep(lineIdx, changed, desc, f);
        return;
      }

      // if
      if(t.indexOf('if (')===0){
        var condSrc=t.slice(t.indexOf('(')+1, t.lastIndexOf(')'));
        var cv=resolveExpr(condSrc, f.vars);
        if(cv){ f.blocks.push({type:'if'}); desc='if ('+condSrc+') = true → entra'; }
        else { f.pc=BM.matchClose[lineIdx]+1; desc='if ('+condSrc+') = false → se salta'; }
        recordStep(lineIdx, changed, desc, f);
        return;
      }

      // else
      if(t==='else' || t.indexOf('else {')===0){
        desc='else → rama alternativa';
        recordStep(lineIdx, changed, desc, f);
        return;
      }

      // System.out.println
      var pr=/^System\.out\.(println|print)\((.*)\);?\s*$/.exec(t);
      if(pr){
        var pv=resolveExpr(pr[2], f.vars);
        output.push(String(pv));
        desc='Imprime: '+pv;
        recordStep(lineIdx, changed, desc, f);
        return;
      }

      // scanner read into array element
      var scan=/^(\w+)\[(\d+)\]\s*=\s*sc\.next(\w+)\(\)\s*;?$/.exec(t);
      if(scan){
        var arr2=f.vars[scan[1]], idx2=+scan[2];
        var val=INPUT[inputIdx++];
        if(scan[3]==='Double') val=val*1.0;
        arr2[idx2]=val; changed.push(scan[1]);
        desc='Scanner.next'+scan[3]+'() → '+scan[1]+'['+idx2+'] = '+val;
        recordStep(lineIdx, changed, desc, f);
        return;
      }

      // declaration: type name = init
      var decl=/^((?:int\[\]|String\[\]|int|double|boolean|String|float|char))\s+(\w+)\s*=\s*(.+);?\s*$/.exec(t);
      if(decl){
        var type=decl[1], name=decl[2], init=decl[3].trim();
        handleInit(type, name, init, f, changed, lineIdx);
        return;
      }

      // array element assignment
      var idxAss=/^(\w+)\[([^\]]+)\]\s*=\s*(.+);?$/.exec(t);
      if(idxAss){
        var aarr=f.vars[idxAss[1]], ai=resolveExpr(idxAss[2], f.vars);
        aarr[ai]=resolveExpr(idxAss[3], f.vars); changed.push(idxAss[1]);
        desc=idxAss[1]+'['+ai+'] = '+aarr[ai];
        recordStep(lineIdx, changed, desc, f);
        return;
      }

      // increment/decrement
      var inc=/^(\w+)(\+\+|\-\-);?$/.exec(t);
      if(inc){
        f.vars[inc[1]] = inc[2]==='++'? f.vars[inc[1]]+1 : f.vars[inc[1]]-1;
        changed.push(inc[1]);
        desc=inc[1]+inc[2]+' → '+inc[1]+'='+f.vars[inc[1]];
        recordStep(lineIdx, changed, desc, f);
        return;
      }

      // while
      var wh=/^while\s*\((.*)\)\s*\{\s*$/.exec(t);
      if(wh){
        var wv=resolveExpr(wh[1], f.vars);
        if(wv){ f.blocks.push({type:'while', cond:wh[1], bodyStart:lineIdx+1}); desc='while: condición true → entra'; }
        else { f.pc=BM.matchClose[lineIdx]+1; desc='while: condición false → se salta'; }
        recordStep(lineIdx, changed, desc, f);
        return;
      }

      // plain assignment
      var asg=/^(\w+)\s*=\s*(.+);?$/.exec(t);
      if(asg){
        f.vars[asg[1]]=resolveExpr(asg[2], f.vars); changed.push(asg[1]);
        desc=asg[1]+' = '+fmtVal(f.vars[asg[1]]);
        recordStep(lineIdx, changed, desc, f);
        return;
      }

      // fallback (signatures, closing class, etc.)
      recordStep(lineIdx, changed, desc, f);
    }

    function handleInit(type, name, init, f, changed, lineIdx){
      var isArr = type.indexOf('[]')>=0;
      var call=/^(\w+)\s*\((.*)\)\s*$/.exec(init);
      if(call && methods[call[1]]){
        var m=methods[call[1]];
        var argVals=splitArgs(call[2]).map(function(e){return resolveExpr(e, f.vars);});
        var nf={method:call[1], vars:{}, pc:m.bodyStart, blocks:[], pendingAssign:{var:name, type:type}};
        m.params.forEach(function(p,ix){ nf.vars[p]=argVals[ix]; });
        frames.push(nf);
        changed.push(name);
        recordStep(lineIdx, changed, 'Llamando a '+call[1]+'('+call[2].trim()+') → guarda en '+name, nf);
        return;
      }
      var arrNew=/^new\s+(?:int|String|double|boolean|float|char)\s*\[\s*(\d+)\s*\]$/.exec(init);
      if(arrNew){
        f.vars[name]=new Array(+arrNew[1]); changed.push(name);
        recordStep(lineIdx, changed, 'new '+type.replace('[]','')+'['+arrNew[1]+'] → '+name, f);
        return;
      }
      var arrLit=/^\{(.*)\}$/.exec(init);
      if(isArr && arrLit){
        f.vars[name]=splitArgs(arrLit[1]).map(function(e){return resolveExpr(e, f.vars);});
        changed.push(name);
        recordStep(lineIdx, changed, name+' = '+arrToStr(f.vars[name]), f);
        return;
      }
      f.vars[name]=resolveExpr(init, f.vars); changed.push(name);
      recordStep(lineIdx, changed, name+' = '+fmtVal(f.vars[name]), f);
    }

    // run until main ends or limit
    var SAFE=600;
    while(frames.length && steps<SAFE){
      executeNext();
      steps++;
      var top=topFrame();
      if(frames.length===1 && top.method==='main' && top.pc > (methods['main'].bodyEnd)) break;
    }
    return trace;
  }

  // ---------- formatting ----------
  function fmtVal(v){
    if(Array.isArray(v)) return arrToStr(v);
    if(v===undefined) return '_';
    return String(v);
  }
  function inferType(v){
    if(Array.isArray(v)) return 'int[]';
    if(typeof v==='number') return (v % 1 ===0)? 'int':'double';
    if(typeof v==='boolean') return 'boolean';
    return 'String';
  }
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ---------- UI ----------
  var trace=simulate();
  var idx=-1, timer=null, playing=false;
  var codeEl=document.getElementById('code');
  var descEl=document.getElementById('stepDesc');
  var csEl=document.getElementById('callstack');
  var varsBody=document.querySelector('#varsTable tbody');
  var outEl=document.getElementById('output');
  var statusEl=document.getElementById('status');
  var speedEl=document.getElementById('speed');
  var speedVal=document.getElementById('speedVal');

  // render code lines
  var html='';
  for(var i=0;i<lines.length;i++){
    html+='<div class="ln" data-line="'+i+'"><span class="num">'+(i+1)+'</span><span class="txt">'+esc(lines[i]||'')+'</span></div>';
  }
  codeEl.innerHTML=html;

  render();

  function render(){
    statusEl.textContent='Paso '+(idx+1)+' / '+trace.length;
    speedVal.textContent=speedEl.value+'ms';
    var els=codeEl.querySelectorAll('.ln');
    for(var i=0;i<els.length;i++) els[i].classList.remove('cur');
    if(idx>=0 && trace[idx]){
      var cur=trace[idx];
      var tgt=els[cur.line];
      if(tgt) tgt.classList.add('cur');
      if(tgt && tgt.scrollIntoView){ tgt.scrollIntoView({block:'nearest'}); }
      descEl.textContent='['+cur.method+'] '+cur.desc;
      csEl.innerHTML='Call stack: <b>'+esc(cur.stack)+'</b>';
      var keys=Object.keys(cur.vars);
      varsBody.innerHTML='';
      if(keys.length===0){ varsBody.innerHTML='<tr><td colspan="3" class="empty">(sin variables locales)</td></tr>'; }
      keys.forEach(function(k){
        var tr=document.createElement('tr');
        if(cur.changed.indexOf(k)>=0) tr.className='changed';
        tr.innerHTML='<td>'+esc(k)+'</td><td>'+esc(fmtVal(cur.vars[k]))+'</td><td><span class="type-tag">'+inferType(cur.vars[k])+'</span></td>';
        varsBody.appendChild(tr);
      });
      outEl.innerHTML='';
      cur.output.forEach(function(o){
        var li=document.createElement('li'); li.textContent=o; outEl.appendChild(li);
      });
    }
    document.getElementById('play').disabled = idx>=trace.length-1;
    document.getElementById('step').disabled = idx>=trace.length-1;
  }

  function play(){
    if(playing) return;
    playing=true; document.getElementById('play').disabled=true;
    timer=setInterval(function(){
      if(idx>=trace.length-1){ pause(); return; }
      idx++; render();
    }, +speedEl.value);
  }
  function pause(){ playing=false; clearInterval(timer); document.getElementById('play').disabled=false; }
  function stop(){ pause(); idx=-1; render(); }
  function step(){ if(idx<trace.length-1){ idx++; render(); } }

  document.getElementById('play').onclick=play;
  document.getElementById('pause').onclick=pause;
  document.getElementById('stop').onclick=stop;
  document.getElementById('step').onclick=step;
  speedEl.oninput=function(){ speedVal.textContent=speedEl.value+'ms'; if(playing){clearInterval(timer); play();} };

  document.addEventListener('keydown', function(e){
    if(e.code==='Space'){ e.preventDefault(); step(); }
    else if(e.key==='p'||e.key==='P'){ play(); }
    else if(e.key==='s'||e.key==='S'){ stop(); }
  });
})();
